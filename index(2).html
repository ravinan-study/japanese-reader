<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1b1f2a;--muted:#6b7280;--line:#e3e7ef;--accent:#315efb;--accent2:#eef2ff}

body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}

.popup{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,560px);display:none;background:#171a22;color:#fff;border-radius:17px;padding:15px 16px;z-index:30;box-shadow:0 18px 45px rgba(0,0,0,.3)}

<script>
const articles=[{"number": 44, "plain": "私は休日に山へハイキングに行きました。その山道は起伏が多く、歩くのは大変でしたが、頂上に着くと青い空を仰ぎ、とても気持ちがよくなりました。山の途中には古い神社があり、今でも多くの人がその神様を信仰しています。しかし、その近くの森では害虫の被害が広がり、被害を防ぐために一部の木を伐採することになりました。また、昔この地域では作物を荒らす動物を討伐したという話が語り継がれています。自然を守ることの大切さを改めて感じた一日でした。", "html": "私は休日に山へハイキングに行きました。その山道は<button class=\"vocab\" type=\"button\" data-term=\"起伏\" data-reading=\"きふく\" data-meaning=\"ขึ้นลง / ความสูงต่ำของพื้นที่\"><ruby><b>起伏</b><rt>きふく</rt></ruby></button>が多く、歩くのは大変でしたが、頂上に着くと青い空を<button class=\"vocab\" type=\"button\" data-term=\"仰ぎ\" data-reading=\"あおぎ\" data-meaning=\"แหงนมอง\"><ruby><b>仰ぎ</b><rt>あおぎ</rt></ruby></button>、とても気持ちがよくなりました。山の途中には古い神社があり、今でも多くの人がその神様を<button class=\"vocab\" type=\"button\" data-term=\"信仰\" data-reading=\"しんこう\" data-meaning=\"ศรัทธา / ความเชื่อทางศาสนา\"><ruby><b>信仰</b><rt>しんこう</rt></ruby></button>しています。しかし、その近くの森では害虫の被害が広がり、被害を防ぐために一部の木を<button class=\"vocab\" type=\"button\" data-term=\"伐採\" data-reading=\"ばっさい\" data-meaning=\"ตัดต้นไม้\"><ruby><b>伐採</b><rt>ばっさい</rt></ruby></button>することになりました。また、昔この地域では作物を荒らす動物を<button class=\"vocab\" type=\"button\" data-term=\"討伐\" data-reading=\"とうばつ\" data-meaning=\"ปราบปราม / กำจัด\"><ruby><b>討伐</b><rt>とうばつ</rt></ruby></button>したという話が語り継がれています。自然を守ることの大切さを改めて感じた一日でした。"}, {"number": 45, "plain": "夏休みに、私は伯父と伯母の家へ遊びに行きました。そこには父の弟である叔父と叔母も集まり、家族みんなで楽しい時間を過ごしました。食事の後、伯父は昔ヨーロッパを旅行したときの話をしてくれました。その中で、お城を見学し、伯爵に関する歴史を学んだことが一番印象に残っていると言いました。また、「大きな成功には努力を伴うものだ」と私たちに教えてくれました。その言葉を聞いて、私は夢をかなえるためには努力を続けようと決心しました。", "html": "夏休みに、私は<button class=\"vocab\" type=\"button\" data-term=\"伯父\" data-reading=\"おじ\" data-meaning=\"ลุงที่อายุมากกว่าพ่อหรือแม่\"><ruby><b>伯父</b><rt>おじ</rt></ruby></button>と<button class=\"vocab\" type=\"button\" data-term=\"伯母\" data-reading=\"おば\" data-meaning=\"ป้าที่อายุมากกว่าพ่อหรือแม่\"><ruby><b>伯母</b><rt>おば</rt></ruby></button>の家へ遊びに行きました。そこには父の弟である<button class=\"vocab\" type=\"button\" data-term=\"叔父\" data-reading=\"おじ\" data-meaning=\"อาที่อายุน้อยกว่าพ่อหรือแม่\"><ruby><b>叔父</b><rt>おじ</rt></ruby></button>と<button class=\"vocab\" type=\"button\" data-term=\"叔母\" data-reading=\"おば\" data-meaning=\"อาหญิงที่อายุน้อยกว่าพ่อหรือแม่\"><ruby><b>叔母</b><rt>おば</rt></ruby></button>も集まり、家族みんなで楽しい時間を過ごしました。食事の後、<button class=\"vocab\" type=\"button\" data-term=\"伯父\" data-reading=\"おじ\" data-meaning=\"ลุงที่อายุมากกว่าพ่อหรือแม่\"><ruby><b>伯父</b><rt>おじ</rt></ruby></button>は昔ヨーロッパを旅行したときの話をしてくれました。その中で、お城を見学し、<button class=\"vocab\" type=\"button\" data-term=\"伯爵\" data-reading=\"はくしゃく\" data-meaning=\"ท่านเคานต์ / บรรดาศักดิ์เคานต์\"><ruby><b>伯爵</b><rt>はくしゃく</rt></ruby></button>に関する歴史を学んだことが一番印象に残っていると言いました。また、「大きな成功には努力を<button class=\"vocab\" type=\"button\" data-term=\"伴う\" data-reading=\"ともなう\" data-meaning=\"มาพร้อมกับ / ควบคู่กับ\"><ruby><b>伴う</b><rt>ともなう</rt></ruby></button>ものだ」と私たちに教えてくれました。その言葉を聞いて、私は夢をかなえるためには努力を続けようと決心しました。"}, {"number": 46, "plain": "私の町では、二つの会社が合併することになりました。その記念イベントでは、日本の歴史を紹介するために侍の衣装を着た人たちが剣術を披露しました。しかし、一人の観客が「そんな格好は時代遅れだ」と言って出演者を侮辱してしまいました。司会者はすぐにその発言を注意し、「相手を尊重することが大切です」と話しました。その言葉を聞いて、観客は出演者に謝罪し、会場は再び温かい雰囲気に包まれました。", "html": "私の町では、二つの会社が<button class=\"vocab\" type=\"button\" data-term=\"合併\" data-reading=\"がっぺい\" data-meaning=\"ควบรวมกิจการ\"><ruby><b>合併</b><rt>がっぺい</rt></ruby></button>することになりました。その記念イベントでは、日本の歴史を紹介するために<button class=\"vocab\" type=\"button\" data-term=\"侍\" data-reading=\"さむらい\" data-meaning=\"ซามูไร\"><ruby><b>侍</b><rt>さむらい</rt></ruby></button>の衣装を着た人たちが剣術を披露しました。しかし、一人の観客が「そんな格好は時代遅れだ」と言って出演者を<button class=\"vocab\" type=\"button\" data-term=\"侮辱\" data-reading=\"ぶじょく\" data-meaning=\"ดูหมิ่น / เหยียดหยาม\"><ruby><b>侮辱</b><rt>ぶじょく</rt></ruby></button>してしまいました。司会者はすぐにその発言を注意し、「相手を尊重することが大切です」と話しました。その言葉を聞いて、観客は出演者に謝罪し、会場は再び温かい雰囲気に包まれました。"}, {"number": 47, "plain": "私は日本の伝統文化について学ぶために、ある町を訪れました。その町では昔ながらの風俗や祭りが今でも大切に受け継がれていました。しかし、観光客の中には世俗的な考え方だけで伝統文化を判断する人もいました。\n祭りでは俵を運ぶ競争や、土俵で行われる相撲大会が開かれ、多くの人でにぎわっていました。その夜、立入禁止の神社に勝手に侵入した人がいて、大きな問題になりました。神主は「神聖な場所を侵す行為は許されません」と厳しく注意しました。また、この地域には昔、外国からの侵略を防ぐために人々が力を合わせて村を守ったという歴史も残っています。その話を聞いた私は、伝統や文化を大切にすることの意味を改めて考えさせられました。", "html": "私は日本の伝統文化について学ぶために、ある町を訪れました。その町では昔ながらの<button class=\"vocab\" type=\"button\" data-term=\"風俗\" data-reading=\"ふうぞく\" data-meaning=\"ขนบธรรมเนียมและวิถีชีวิต\"><ruby><b>風俗</b><rt>ふうぞく</rt></ruby></button>や祭りが今でも大切に受け継がれていました。しかし、観光客の中には<button class=\"vocab\" type=\"button\" data-term=\"世俗的\" data-reading=\"せぞくてき\" data-meaning=\"ทางโลก / แบบโลกีย์\"><ruby><b>世俗的</b><rt>せぞくてき</rt></ruby></button>な考え方だけで伝統文化を判断する人もいました。<br><br>祭りでは<button class=\"vocab\" type=\"button\" data-term=\"俵\" data-reading=\"たわら\" data-meaning=\"กระสอบฟาง / มัดฟาง\"><ruby><b>俵</b><rt>たわら</rt></ruby></button>を運ぶ競争や、<button class=\"vocab\" type=\"button\" data-term=\"土俵\" data-reading=\"どひょう\" data-meaning=\"เวทีซูโม่\"><ruby><b>土俵</b><rt>どひょう</rt></ruby></button>で行われる相撲大会が開かれ、多くの人でにぎわっていました。その夜、立入禁止の神社に勝手に<button class=\"vocab\" type=\"button\" data-term=\"侵入\" data-reading=\"しんにゅう\" data-meaning=\"บุกรุก / เข้าโดยไม่ได้รับอนุญาต\"><ruby><b>侵入</b><rt>しんにゅう</rt></ruby></button>した人がいて、大きな問題になりました。神主は「神聖な場所を<button class=\"vocab\" type=\"button\" data-term=\"侵す\" data-reading=\"おかす\" data-meaning=\"ล่วงละเมิด / รุกล้ำ\"><ruby><b>侵す</b><rt>おかす</rt></ruby></button>行為は許されません」と厳しく注意しました。また、この地域には昔、外国からの<button class=\"vocab\" type=\"button\" data-term=\"侵略\" data-reading=\"しんりゃく\" data-meaning=\"รุกราน\"><ruby><b>侵略</b><rt>しんりゃく</rt></ruby></button>を防ぐために人々が力を合わせて村を守ったという歴史も残っています。その話を聞いた私は、伝統や文化を大切にすることの意味を改めて考えさせられました。"}, {"number": 48, "plain": "俺は子どものころから祖父をとても尊敬していました。祖父はいつも倹約を心がけ、物を大切に使っていました。ある日、祖父は「無駄遣いをしないことが将来のためになる」と教えてくれました。それ以来、俺は祖父の生活に倣って、毎月少しずつ貯金をするようになりました。友達の中には、お金持ちの生活をただ模倣する人もいましたが、私は自分に合った生活を続けることが大切だと思いました。そのおかげで、今では計画的にお金を使えるようになりました。", "html": "<button class=\"vocab\" type=\"button\" data-term=\"俺\" data-reading=\"おれ\" data-meaning=\"ฉัน/ผม (ภาษาพูดแบบผู้ชาย)\"><ruby><b>俺</b><rt>おれ</rt></ruby></button>は子どものころから祖父をとても尊敬していました。祖父はいつも<button class=\"vocab\" type=\"button\" data-term=\"倹約\" data-reading=\"けんやく\" data-meaning=\"ประหยัด\"><ruby><b>倹約</b><rt>けんやく</rt></ruby></button>を心がけ、物を大切に使っていました。ある日、祖父は「無駄遣いをしないことが将来のためになる」と教えてくれました。それ以来、<button class=\"vocab\" type=\"button\" data-term=\"俺\" data-reading=\"おれ\" data-meaning=\"ฉัน/ผม (ภาษาพูดแบบผู้ชาย)\"><ruby><b>俺</b><rt>おれ</rt></ruby></button>は祖父の生活に<button class=\"vocab\" type=\"button\" data-term=\"倣って\" data-reading=\"ならって\" data-meaning=\"ทำตาม / เลียนแบบเป็นแบบอย่าง\"><ruby><b>倣って</b><rt>ならって</rt></ruby></button>、毎月少しずつ貯金をするようになりました。友達の中には、お金持ちの生活をただ<button class=\"vocab\" type=\"button\" data-term=\"模倣\" data-reading=\"もほう\" data-meaning=\"เลียนแบบ\"><ruby><b>模倣</b><rt>もほう</rt></ruby></button>する人もいましたが、私は自分に合った生活を続けることが大切だと思いました。そのおかげで、今では計画的にお金を使えるようになりました。"}, {"number": 49, "plain": "高校時代、私は勉強の偏りがあり、数学ばかり勉強していました。そのため、成績も教科によって偏ってしまい、偏差値も思うように上がりませんでした。また、好き嫌いが多く偏食だったので、先生から生活習慣を見直すように言われました。\nある日、学校で卒業証明書を偽造した学生が見つかりました。彼は偽りの説明をしましたが、結局すべて明らかになりました。その出来事をきっかけに、先生は「人を偏見で判断してはいけないが、うそをつくことも決して許されない」と話しました。\n私はその言葉を胸に刻み、それからは図書館の傍らにある自習室で毎日勉強するようになりました。苦手な科目にも取り組み、好き嫌いなく食事をするよう心がけた結果、成績は少しずつ伸び、自分自身も大きく成長することができました。", "html": "高校時代、私は勉強の<button class=\"vocab\" type=\"button\" data-term=\"偏り\" data-reading=\"かたより\" data-meaning=\"ความเอนเอียง / ไม่สมดุล\"><ruby><b>偏り</b><rt>かたより</rt></ruby></button>があり、数学ばかり勉強していました。そのため、成績も教科によって<button class=\"vocab\" type=\"button\" data-term=\"偏って\" data-reading=\"かたよって\" data-meaning=\"เอนเอียง / ไม่สมดุล\"><ruby><b>偏って</b><rt>かたよって</rt></ruby></button>しまい、<button class=\"vocab\" type=\"button\" data-term=\"偏差値\" data-reading=\"へんさち\" data-meaning=\"คะแนนมาตรฐาน\"><ruby><b>偏差値</b><rt>へんさち</rt></ruby></button>も思うように上がりませんでした。また、好き嫌いが多く<button class=\"vocab\" type=\"button\" data-term=\"偏食\" data-reading=\"へんしょく\" data-meaning=\"เลือกกิน / กินไม่สมดุล\"><ruby><b>偏食</b><rt>へんしょく</rt></ruby></button>だったので、先生から生活習慣を見直すように言われました。<br><br>ある日、学校で卒業証明書を<button class=\"vocab\" type=\"button\" data-term=\"偽造\" data-reading=\"ぎぞう\" data-meaning=\"ปลอมแปลง\"><ruby><b>偽造</b><rt>ぎぞう</rt></ruby></button>した学生が見つかりました。彼は<button class=\"vocab\" type=\"button\" data-term=\"偽り\" data-reading=\"いつわり\" data-meaning=\"การโกหก / สิ่งเท็จ\"><ruby><b>偽り</b><rt>いつわり</rt></ruby></button>の説明をしましたが、結局すべて明らかになりました。その出来事をきっかけに、先生は「人を<button class=\"vocab\" type=\"button\" data-term=\"偏見\" data-reading=\"へんけん\" data-meaning=\"อคติ\"><ruby><b>偏見</b><rt>へんけん</rt></ruby></button>で判断してはいけないが、うそをつくことも決して許されない」と話しました。<br><br>私はその言葉を胸に刻み、それからは図書館の<button class=\"vocab\" type=\"button\" data-term=\"傍ら\" data-reading=\"かたわら\" data-meaning=\"ข้าง ๆ / ริม\"><ruby><b>傍ら</b><rt>かたわら</rt></ruby></button>にある自習室で毎日勉強するようになりました。苦手な科目にも取り組み、好き嫌いなく食事をするよう心がけた結果、成績は少しずつ伸び、自分自身も大きく成長することができました。"}, {"number": 50, "plain": "小さな町で家具工場を経営していた田中さんは、長年の不景気で大きな負債を抱えていました。会社の負債額は毎年増え続け、残っている貯金も僅かしかありませんでした。それでも田中さんは諦めず、職人たちと力を合わせて新しい家具を作り続けました。ある日、その家具が「今年最高の傑作だ」と高く評価され、多くの注文が集まりました。そのおかげで会社の経営は少しずつ回復し、田中さんは再び希望を持つことができました。", "html": "小さな町で家具工場を経営していた田中さんは、長年の不景気で大きな<button class=\"vocab\" type=\"button\" data-term=\"負債\" data-reading=\"ふさい\" data-meaning=\"หนี้สิน\"><ruby><b>負債</b><rt>ふさい</rt></ruby></button>を抱えていました。会社の<button class=\"vocab\" type=\"button\" data-term=\"負債額\" data-reading=\"ふさいがく\" data-meaning=\"จำนวนหนี้สิน\"><ruby><b>負債額</b><rt>ふさいがく</rt></ruby></button>は毎年増え続け、残っている貯金も<button class=\"vocab\" type=\"button\" data-term=\"僅か\" data-reading=\"わずか\" data-meaning=\"เพียงเล็กน้อย\"><ruby><b>僅か</b><rt>わずか</rt></ruby></button>しかありませんでした。それでも田中さんは諦めず、職人たちと力を合わせて新しい家具を作り続けました。ある日、その家具が「今年最高の<button class=\"vocab\" type=\"button\" data-term=\"傑作\" data-reading=\"けっさく\" data-meaning=\"ผลงานชิ้นเอก\"><ruby><b>傑作</b><rt>けっさく</rt></ruby></button>だ」と高く評価され、多くの注文が集まりました。そのおかげで会社の経営は少しずつ回復し、田中さんは再び希望を持つことができました。"}, {"number": 51, "plain": "修学旅行で、私たちは古いお寺を訪れました。お寺では一人の僧と尼僧が寺の歴史について説明してくれました。その後、庭にある大きな池の直径と半径を測る体験をしました。しかし、見学中に一人の生徒が誤って石灯籠を壊してしまいました。学校は寺に謝罪し、修理費を弁償することになりました。また、文化財への被害については保険会社が一部を補償し、残りは学校が賠償することになりました。この出来事を通して、私たちは文化財を大切にすることの重要さを学びました。", "html": "修学旅行で、私たちは古いお寺を訪れました。お寺では一人の<button class=\"vocab\" type=\"button\" data-term=\"僧\" data-reading=\"そう\" data-meaning=\"พระภิกษุ\"><ruby><b>僧</b><rt>そう</rt></ruby></button>と<button class=\"vocab\" type=\"button\" data-term=\"尼僧\" data-reading=\"にそう\" data-meaning=\"แม่ชี / ภิกษุณี\"><ruby><b>尼僧</b><rt>にそう</rt></ruby></button>が寺の歴史について説明してくれました。その後、庭にある大きな池の<button class=\"vocab\" type=\"button\" data-term=\"直径\" data-reading=\"ちょっけい\" data-meaning=\"เส้นผ่านศูนย์กลาง\"><ruby><b>直径</b><rt>ちょっけい</rt></ruby></button>と<button class=\"vocab\" type=\"button\" data-term=\"半径\" data-reading=\"はんけい\" data-meaning=\"รัศมี\"><ruby><b>半径</b><rt>はんけい</rt></ruby></button>を測る体験をしました。しかし、見学中に一人の生徒が誤って石灯籠を壊してしまいました。学校は寺に謝罪し、修理費を<button class=\"vocab\" type=\"button\" data-term=\"弁償\" data-reading=\"べんしょう\" data-meaning=\"ชดใช้ค่าเสียหาย\"><ruby><b>弁償</b><rt>べんしょう</rt></ruby></button>することになりました。また、文化財への被害については保険会社が一部を<button class=\"vocab\" type=\"button\" data-term=\"補償\" data-reading=\"ほしょう\" data-meaning=\"ชดเชย / คุ้มครองความเสียหาย\"><ruby><b>補償</b><rt>ほしょう</rt></ruby></button>し、残りは学校が<button class=\"vocab\" type=\"button\" data-term=\"賠償\" data-reading=\"ばいしょう\" data-meaning=\"ชดใช้ค่าเสียหายตามความรับผิด\"><ruby><b>賠償</b><rt>ばいしょう</rt></ruby></button>することになりました。この出来事を通して、私たちは文化財を大切にすることの重要さを学びました。"}, {"number": 52, "plain": "私は大学で生物学を勉強しています。ある日、先生は顕微鏡を使って池の水を観察する実験を行いました。水の中には微量の栄養分しかありませんでしたが、多くの微生物が生きていて、自然の循環の大切さを学ぶことができました。さらに、肉眼では見えないほど微塵の粒まで観察でき、私は驚きました。\n実験が終わると、先生は微笑みながら、「科学を学ぶことは自然を征服することではなく、自然を理解することです」と話しました。その言葉を聞いた私は、教室の窓から差し込む微かな光を見つめながら深く考えました。自然と人間の関係はとても微妙であり、大切にしなければならないと感じました。", "html": "私は大学で生物学を勉強しています。ある日、先生は<button class=\"vocab\" type=\"button\" data-term=\"顕微鏡\" data-reading=\"けんびきょう\" data-meaning=\"กล้องจุลทรรศน์\"><ruby><b>顕微鏡</b><rt>けんびきょう</rt></ruby></button>を使って池の水を観察する実験を行いました。水の中には<button class=\"vocab\" type=\"button\" data-term=\"微量\" data-reading=\"びりょう\" data-meaning=\"ปริมาณเล็กน้อยมาก\"><ruby><b>微量</b><rt>びりょう</rt></ruby></button>の栄養分しかありませんでしたが、多くの微生物が生きていて、自然の<button class=\"vocab\" type=\"button\" data-term=\"循環\" data-reading=\"じゅんかん\" data-meaning=\"การหมุนเวียน\"><ruby><b>循環</b><rt>じゅんかん</rt></ruby></button>の大切さを学ぶことができました。さらに、肉眼では見えないほど<button class=\"vocab\" type=\"button\" data-term=\"微塵\" data-reading=\"みじん\" data-meaning=\"อนุภาคเล็กมาก / ผงละเอียด\"><ruby><b>微塵</b><rt>みじん</rt></ruby></button>の粒まで観察でき、私は驚きました。<br><br>実験が終わると、先生は<button class=\"vocab\" type=\"button\" data-term=\"微笑\" data-reading=\"びしょう\" data-meaning=\"รอยยิ้มอ่อน ๆ\"><ruby><b>微笑</b><rt>びしょう</rt></ruby></button>みながら、「科学を学ぶことは自然を<button class=\"vocab\" type=\"button\" data-term=\"征服\" data-reading=\"せいふく\" data-meaning=\"พิชิต / เอาชนะ\"><ruby><b>征服</b><rt>せいふく</rt></ruby></button>することではなく、自然を理解することです」と話しました。その言葉を聞いた私は、教室の窓から差し込む<button class=\"vocab\" type=\"button\" data-term=\"微か\" data-reading=\"かすか\" data-meaning=\"เลือนราง / แผ่วเบา\"><ruby><b>微か</b><rt>かすか</rt></ruby></button>な光を見つめながら深く考えました。自然と人間の関係はとても<button class=\"vocab\" type=\"button\" data-term=\"微妙\" data-reading=\"びみょう\" data-meaning=\"ละเอียดอ่อน / คลุมเครือ\"><ruby><b>微妙</b><rt>びみょう</rt></ruby></button>であり、大切にしなければならないと感じました。"}, {"number": 53, "plain": "高校では、先生がいつも「勉強だけでなく、道徳も大切です」と話していました。ある日、私たちは交通安全について学び、先生は「ルールを徹底して守ることが事故を防ぐ第一歩です」と説明しました。そして、「一度やると決めたことは最後までやり徹することが大切です」とも教えてくれました。\nその日の夜、試験勉強のために徹夜していた私は、翌朝ニュースで大きな衝突事故が起きたことを知りました。トラックと乗用車が衝突し、多くの人が衝撃を受けました。そのニュースを見た私は、交通ルールを守ることや命を大切にすることも道徳の一つなのだと改めて感じました。", "html": "高校では、先生がいつも「勉強だけでなく、<button class=\"vocab\" type=\"button\" data-term=\"道徳\" data-reading=\"どうとく\" data-meaning=\"ศีลธรรม\"><ruby><b>道徳</b><rt>どうとく</rt></ruby></button>も大切です」と話していました。ある日、私たちは交通安全について学び、先生は「ルールを<button class=\"vocab\" type=\"button\" data-term=\"徹底\" data-reading=\"てってい\" data-meaning=\"อย่างทั่วถึง / อย่างเคร่งครัด\"><ruby><b>徹底</b><rt>てってい</rt></ruby></button>して守ることが事故を防ぐ第一歩です」と説明しました。そして、「一度やると決めたことは最後までやり<button class=\"vocab\" type=\"button\" data-term=\"徹する\" data-reading=\"てっする\" data-meaning=\"ยึดมั่นทำจนถึงที่สุด\"><ruby><b>徹する</b><rt>てっする</rt></ruby></button>ことが大切です」とも教えてくれました。<br><br>その日の夜、試験勉強のために<button class=\"vocab\" type=\"button\" data-term=\"徹夜\" data-reading=\"てつや\" data-meaning=\"อดนอนทั้งคืน\"><ruby><b>徹夜</b><rt>てつや</rt></ruby></button>していた私は、翌朝ニュースで大きな<button class=\"vocab\" type=\"button\" data-term=\"衝突事故\" data-reading=\"しょうとつじこ\" data-meaning=\"อุบัติเหตุชนกัน\"><ruby><b>衝突事故</b><rt>しょうとつじこ</rt></ruby></button>が起きたことを知りました。トラックと乗用車が<button class=\"vocab\" type=\"button\" data-term=\"衝突\" data-reading=\"しょうとつ\" data-meaning=\"ชน / ปะทะ\"><ruby><b>衝突</b><rt>しょうとつ</rt></ruby></button>し、多くの人が<button class=\"vocab\" type=\"button\" data-term=\"衝撃\" data-reading=\"しょうげき\" data-meaning=\"แรงกระแทก / ความตกใจอย่างรุนแรง\"><ruby><b>衝撃</b><rt>しょうげき</rt></ruby></button>を受けました。そのニュースを見た私は、交通ルールを守ることや命を大切にすることも<button class=\"vocab\" type=\"button\" data-term=\"道徳\" data-reading=\"どうとく\" data-meaning=\"ศีลธรรม\"><ruby><b>道徳</b><rt>どうとく</rt></ruby></button>の一つなのだと改めて感じました。"}];
let index=0,currentWord='';
const no=document.getElementById('lessonNo'), text=document.getElementById('lessonText'), counter=document.getElementById('counter'), progress=document.getElementById('progress');
function renderProgress(){progress.innerHTML='';articles.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a.number;b.className=i===index?'active':'';b.onclick=()=>{index=i;render();};progress.appendChild(b);})}
function render(){const a=articles[index];no.textContent=a.number;text.innerHTML=a.html;counter.textContent=`บท ${index+1} / ${articles.length}`;renderProgress();localStorage.setItem('readerLesson',a.number);window.scrollTo({top:0,behavior:'smooth'});}
function move(d){index=Math.max(0,Math.min(articles.length-1,index+d));render();}
function jumpTo(){const n=Number(document.getElementById('jump').value);const i=articles.findIndex(a=>a.number===n);if(i>=0){index=i;render();}else alert('ไม่พบบทนี้ในชุดปัจจุบัน');}
function utter(t){const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=Number(document.getElementById('rate').value);return u;}
function readCurrent(){stopSpeech();const a=articles[index],u=utter(a.plain);u.onstart=()=>document.getElementById('status').textContent='กำลังอ่านบท '+a.number;u.onend=()=>document.getElementById('status').textContent='อ่านจบแล้ว';speechSynthesis.speak(u);}
function stopSpeech(){speechSynthesis.cancel();document.getElementById('status').textContent='หยุดแล้ว';}
function speakWord(){if(!currentWord)return;stopSpeech();speechSynthesis.speak(utter(currentWord));}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('readerDark',document.body.classList.contains('dark')?'1':'0');}
document.addEventListener('click',e=>{const v=e.target.closest('.vocab');if(v){e.preventDefault();document.querySelectorAll('.vocab.open').forEach(x=>x!==v&&x.classList.remove('open'));v.classList.toggle('open');currentWord=v.dataset.term;document.getElementById('pTerm').textContent=v.dataset.term;document.getElementById('pReading').textContent=v.dataset.reading;document.getElementById('pMeaning').textContent=v.dataset.meaning;document.getElementById('popup').classList.add('show');}else if(!e.target.closest('.popup'))document.getElementById('popup').classList.remove('show');});
window.addEventListener('load',()=>{if(localStorage.getItem('readerDark')==='1')document.body.classList.add('dark');const saved=Number(localStorage.getItem('readerLesson'));const i=articles.findIndex(a=>a.number===saved);if(i>=0)index=i;render();});
window.addEventListener('beforeunload',()=>speechSynthesis.cancel());
</script>
