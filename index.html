<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japanese Reader</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#171b24;--muted:#667085;--line:#dfe4ec;--accent:#315efb;--accent2:#eef2ff}
body.dark{--bg:#111318;--card:#1c2028;--text:#f4f5f7;--muted:#b5bdca;--line:#343a46;--accent:#88a0ff;--accent2:#252b3b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:12px}.wrap{max-width:920px;margin:auto}h1{font-size:22px;margin:0 0 10px}.controls{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}button{cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.status{font-size:13px;color:var(--muted);margin-top:8px}
main{max-width:920px;margin:auto;padding:18px 12px 90px}.navrow{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}.navrow .group{display:flex;gap:8px;flex-wrap:wrap}.lesson{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.lesson.reading{outline:2px solid var(--accent)}.lesson h2{font-size:30px;margin:0 0 14px}.paragraph{font-size:21px;line-height:2.2;letter-spacing:.015em;margin:0 0 14px}.vocab{font-weight:800;text-decoration:underline dotted var(--accent);text-underline-offset:5px;cursor:pointer;border-radius:5px;padding:0 2px}.vocab:hover,.vocab:focus{background:var(--accent2);outline:none}ruby rt{visibility:hidden;font-size:.52em;color:var(--accent)}ruby.show rt,body.show-all rt{visibility:visible}.empty{padding:30px;text-align:center;color:var(--muted)}
.popup{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,560px);display:none;background:#171a22;color:white;border-radius:16px;padding:16px;box-shadow:0 16px 50px rgba(0,0,0,.35);z-index:30}.popup.show{display:block}.popup-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.term{font-size:26px;font-weight:800}.reading{font-size:19px;color:#cbd5ff;margin:3px 0}.meaning{font-size:17px;line-height:1.6}.popup button{background:#2b3140;color:white;border-color:#4b5364}
@media(max-width:600px){.paragraph{font-size:19px;line-height:2.3}.lesson{padding:16px}.navrow{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="wrap"><h1>日本語リーダー</h1><div class="controls">
<input id="jump" inputmode="numeric" placeholder="เลขบท เช่น 44" size="12"><button onclick="jumpLesson()">ไป</button>
<select id="lessonSelect" onchange="showLesson(Number(this.value))"></select>
<button class="primary" onclick="readCurrent()">🔊 อ่านบทนี้</button><button onclick="speechSynthesis.pause()">⏸ พัก</button><button onclick="speechSynthesis.resume()">▶ ต่อ</button><button onclick="stopSpeech()">■ หยุด</button>
<select id="rate"><option value=".7">0.7×</option><option value=".85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option></select>
<button onclick="document.body.classList.toggle('show-all')">あ Furigana ทั้งหมด</button><button onclick="toggleDark()">🌙 กลางคืน</button>
</div><div class="status" id="status">กำลังโหลดบทเรียน…</div></div></header>
<main><div class="navrow"><div class="group"><button onclick="prevLesson()">← บทก่อน</button><button onclick="nextLesson()">บทถัดไป →</button></div><div id="rangeLabel" class="status"></div></div><div id="app"></div></main>
<div class="popup" id="popup"><div class="popup-head"><div><div class="term" id="pTerm"></div><div class="reading" id="pReading"></div></div><button onclick="speakWord()">🔊 ฟังคำ</button></div><div class="meaning" id="pMeaning"></div></div>
<script>
window.JP_READER_PACKS=[];let articles=[],currentNumber=null,currentWord='';
async function loadAll(){try{const manifest=await fetch('lessons.json?ts='+Date.now());if(!manifest.ok)throw new Error('เปิด lessons.json ไม่ได้');const data=await manifest.json();for(const file of data.files){await loadScript(file+'?ts='+Date.now())}articles=window.JP_READER_PACKS.flat().sort((a,b)=>a.number-b.number);if(!articles.length)throw new Error('ไม่พบบทเรียน');buildSelect();const saved=Number(localStorage.getItem('lastLesson'));showLesson(articles.some(a=>a.number===saved)?saved:articles[0].number);document.getElementById('status').textContent='แตะคำตัวหนาเพื่อดูคำอ่านและคำแปล';}catch(e){document.getElementById('app').innerHTML='<div class="empty">โหลดบทเรียนไม่สำเร็จ: '+escapeHtml(e.message)+'</div>';document.getElementById('status').textContent='เกิดข้อผิดพลาด';}}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('โหลด '+src+' ไม่ได้'));document.head.appendChild(s);});}
function buildSelect(){const sel=document.getElementById('lessonSelect');sel.innerHTML=articles.map(a=>`<option value="${a.number}">บท ${a.number}</option>`).join('');document.getElementById('rangeLabel').textContent=`มีบท ${articles[0].number}–${articles.at(-1).number}`;}
function showLesson(num){const a=articles.find(x=>x.number===num);if(!a)return;stopSpeech();currentNumber=num;localStorage.setItem('lastLesson',String(num));document.getElementById('lessonSelect').value=String(num);const paras=a.paragraphs.map(p=>'<p class="paragraph">'+p.segments.map(renderSeg).join('')+'</p>').join('');document.getElementById('app').innerHTML=`<article class="lesson" id="currentLesson"><h2>${a.number}</h2>${paras}</article>`;window.scrollTo({top:0,behavior:'smooth'});}
function renderSeg(s){if(!s.bold)return escapeHtml(s.text);const t=escapeHtml(s.text),r=escapeHtml(s.reading||''),m=escapeHtml(s.meaning||'');return `<ruby class="vocab" tabindex="0" data-term="${t}" data-reading="${r}" data-meaning="${m}"><span>${t}</span><rt>${r}</rt></ruby>`;}
function plainText(a){return a.paragraphs.map(p=>p.plain).join('。');}
function utter(text){const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=Number(document.getElementById('rate').value);return u;}
function readCurrent(){const a=articles.find(x=>x.number===currentNumber);if(!a)return;stopSpeech();const box=document.getElementById('currentLesson');box?.classList.add('reading');const u=utter(plainText(a));u.onstart=()=>document.getElementById('status').textContent='กำลังอ่านบท '+a.number;u.onend=()=>{box?.classList.remove('reading');document.getElementById('status').textContent='อ่านจบแล้ว';};speechSynthesis.speak(u);}
function stopSpeech(){speechSynthesis.cancel();document.getElementById('currentLesson')?.classList.remove('reading');}
function prevLesson(){const i=articles.findIndex(a=>a.number===currentNumber);if(i>0)showLesson(articles[i-1].number)}function nextLesson(){const i=articles.findIndex(a=>a.number===currentNumber);if(i>=0&&i<articles.length-1)showLesson(articles[i+1].number)}
function jumpLesson(){const n=Number(document.getElementById('jump').value);if(articles.some(a=>a.number===n))showLesson(n);else alert('ยังไม่มีบท '+n);}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('darkMode',document.body.classList.contains('dark')?'1':'0')}
document.addEventListener('click',e=>{const r=e.target.closest('.vocab');if(r){document.querySelectorAll('ruby.show').forEach(x=>x!==r&&x.classList.remove('show'));r.classList.toggle('show');currentWord=r.dataset.term;document.getElementById('pTerm').textContent=r.dataset.term;document.getElementById('pReading').textContent=r.dataset.reading;document.getElementById('pMeaning').textContent=r.dataset.meaning||'ยังไม่มีคำแปล';document.getElementById('popup').classList.add('show');}else if(!e.target.closest('.popup'))document.getElementById('popup').classList.remove('show');});
function speakWord(){if(!currentWord)return;speechSynthesis.cancel();speechSynthesis.speak(utter(currentWord));}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
if(localStorage.getItem('darkMode')==='1')document.body.classList.add('dark');window.addEventListener('beforeunload',()=>speechSynthesis.cancel());loadAll();
</script>
</body></html>
