<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日本語リーダー 44–53</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1b1f2a;--muted:#6b7280;--line:#e3e7ef;--accent:#315efb;--accent2:#eef2ff}
body.dark{--bg:#111318;--card:#1b1f26;--text:#f5f6f8;--muted:#aab2c0;--line:#353b47;--accent:#86a0ff;--accent2:#252d48}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px}
.wrap{max-width:900px;margin:auto}
h1{font-size:21px;margin:0 0 10px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 11px;min-height:42px}
button{cursor:pointer}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.status{font-size:13px;color:var(--muted);margin-top:8px}
main{max-width:900px;margin:auto;padding:18px 13px 90px}
.navigator{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px rgba(20,30,60,.04)}
.lesson h2{font-size:32px;margin:0 0 15px}
.text{font-size:21px;line-height:2.25;letter-spacing:.015em}
.vocab{display:inline;padding:0 2px;min-height:0;border:0;border-radius:5px;background:transparent;color:inherit;text-decoration:underline dotted var(--accent);text-underline-offset:4px}
.vocab:hover,.vocab:focus{background:var(--accent2);outline:none}
ruby rt{visibility:hidden;font-size:.52em;color:var(--accent);font-weight:700}
.vocab:hover rt,.vocab:focus rt,.vocab.open rt,body.show-all rt{visibility:visible}
.progress{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:8px}
.progress button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.popup{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92vw,560px);display:none;background:#171a22;color:#fff;border-radius:17px;padding:15px 16px;z-index:30;box-shadow:0 18px 45px rgba(0,0,0,.3)}
.popup.show{display:block}
.popup .term{font-size:25px;font-weight:800}
.popup .reading{font-size:18px;color:#cbd5ff;margin:3px 0}
.popup .meaning{font-size:17px}
.popup-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.popup button{background:#292f3d;color:#fff;border-color:#454e61}
@media(max-width:600px){.text{font-size:19px;line-height:2.35}.lesson{padding:15px}.navigator button{padding:8px 9px}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>日本語リーダー 44–53</h1>
<div class="controls">
<button class="primary" onclick="readCurrent()">🔊 อ่านบทนี้</button>
<button onclick="speechSynthesis.pause()">⏸ พัก</button>
<button onclick="speechSynthesis.resume()">▶ อ่านต่อ</button>
<button onclick="stopSpeech()">■ หยุด</button>
<select id="rate"><option value="0.7">0.7×</option><option value="0.85" selected>0.85×</option><option value="1">1×</option><option value="1.15">1.15×</option></select>
<button onclick="document.body.classList.toggle('show-all')">あ Furigana ทั้งหมด</button>
<button onclick="toggleDark()">🌙 กลางคืน</button>
<input id="jump" inputmode="numeric" placeholder="ไปบท เช่น 49" size="10">
<button onclick="jumpTo()">ไป</button>
</div>
<div class="status" id="status">แตะคำตัวหนาเพื่อดูคำอ่านและคำแปลไทย</div>
</div></header>
<main>
<div class="progress" id="progress"></div>
<div class="navigator"><button onclick="move(-1)">← บทก่อน</button><span id="counter"></span><button onclick="move(1)">บทถัดไป →</button></div>
<article class="lesson"><h2 id="lessonNo"></h2><div class="text" id="lessonText"></div></article>
</main>
<div class="popup" id="popup"><div class="popup-row"><div><div class="term" id="pTerm"></div><div class="reading" id="pReading"></div></div><button onclick="speakWord()">🔊 ฟังคำ</button></div><div class="meaning" id="pMeaning"></div></div>
<script>
</script>
<script src="articles.js"></script>
<script>
let index=0,currentWord='';
const no=document.getElementById('lessonNo'), text=document.getElementById('lessonText'), counter=document.getElementById('counter'), progress=document.getElementById('progress');
function renderProgress(){progress.innerHTML='';articles.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a.number;b.className=i===index?'active':'';b.onclick=()=>{index=i;render();};progress.appendChild(b);})}
function render(){const a=articles[index];no.textContent=a.number;text.innerHTML=a.html;counter.textContent=`บท ${index+1} / ${articles.length}`;renderProgress();localStorage.setItem('readerLesson',a.number);window.scrollTo({top:0,behavior:'smooth'});}
function move(d){index=Math.max(0,Math.min(articles.length-1,index+d));render();}
function jumpTo(){const n=Number(document.getElementById('jump').value);const i=articles.findIndex(a=>a.number===n);if(i>=0){index=i;render();}else alert('ไม่พบบทนี้ในชุดปัจจุบัน');}
function utter(t){const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=Number(document.getElementById('rate').value);return u;}
function readCurrent(){stopSpeech();const a=articles[index],u=utter(a.plain);u.onstart=()=>document.getElementById('status').textContent='กำลังอ่านบท '+a.number;u.onend=()=>document.getElementById('status').textContent='อ่านจบแล้ว';speechSynthesis.speak(u);}
function stopSpeech(){speechSynthesis.cancel();document.getElementById('status').textContent='หยุดแล้ว';}
function speakWord(){if(!currentWord)return;stopSpeech();speechSynthesis.speak(utter(currentWord));}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('readerDark',document.body.classList.contains('dark')?'1':'0');}
document.addEventListener('click',e=>{const v=e.target.closest('.vocab');if(v){e.preventDefault();document.querySelectorAll('.vocab.open').forEach(x=>x!==v&&x.classList.remove('open'));v.classList.toggle('open');currentWord=v.dataset.term;document.getElementById('pTerm').textContent=v.dataset.term;document.getElementById('pReading').textContent=v.dataset.reading;document.getElementById('pMeaning').textContent=v.dataset.meaning;document.getElementById('popup').classList.add('show');}else if(!e.target.closest('.popup'))document.getElementById('popup').classList.remove('show');});
window.addEventListener('load',()=>{if(localStorage.getItem('readerDark')==='1')document.body.classList.add('dark');const saved=Number(localStorage.getItem('readerLesson'));const i=articles.findIndex(a=>a.number===saved);if(i>=0)index=i;render();});
window.addEventListener('beforeunload',()=>speechSynthesis.cancel());
</script>
</body>
</html>
